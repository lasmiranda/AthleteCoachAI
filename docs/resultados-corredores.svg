<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1530" viewBox="0 0 1800 1530" role="img" aria-labelledby="title description">
  <title id="title">Corredores: primer clasificador experimental de etiqueta fuente</title>
  <desc id="description">Test real congelado del modelo runners-day-logistic-v1. Personas separadas: 10546 ventanas de 15 personas, 150 positivas; AP modelo 0.017604 frente a 0.014223, ROC-AUC 0.584473. Al umbral 0.02: TN7631, FP2765, FN98, TP52. Temporal con purga: 7596 ventanas de 32 personas recurrentes, 122 positivas; AP0.021839 frente a0.016061, ROC-AUC0.587050. Matriz TN5603, FP1871, FN77, TP45. No es diagnóstico ni predicción clínica validada.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #14283e; }
    .title { font-size: 45px; font-weight: 700; }
    .heading { font-size: 34px; font-weight: 700; }
    .body { font-size: 28px; }
    .small { font-size: 25px; }
    .number { font-size: 64px; font-weight: 700; }
    .muted { fill: #506477; }
    .white { fill: white; }
  </style>
  <rect width="1800" height="1530" fill="#eef3f8"/>
  <text x="60" y="77" class="title">Corredores: entrenamiento real, resultado todavía débil</text>
  <text x="60" y="124" class="body">Etiqueta fuente del día t con variables de t−7 a t−1. Sin integración en AthleteOS.</text>
  <rect x="55" y="151" width="1690" height="57" rx="12" fill="#fff0d9"/>
  <text x="80" y="188" class="body">Investigación retrospectiva; score no calibrado. No demuestra riesgo clínico ni prevención.</text>

  <rect x="55" y="230" width="825" height="1070" rx="20" fill="white"/>
  <rect x="920" y="230" width="825" height="1070" rx="20" fill="white"/>
  <text x="85" y="280" class="heading">Principal: personas separadas</text>
  <text x="85" y="323" class="body">Test: 10,546 ventanas · 15 personas nuevas*</text>
  <text x="85" y="363" class="body">150 positivas · prevalencia 1.4223%</text>
  <text x="950" y="280" class="heading">Secundario: temporal con purga</text>
  <text x="950" y="323" class="body">Test: 7,596 ventanas · 32 personas presentes</text>
  <text x="950" y="363" class="body">122 positivas · prevalencia 1.6061%</text>

  <text x="85" y="416" class="body">Average precision (AP) · escala común 0–0.04</text>
  <text x="950" y="416" class="body">Average precision (AP) · escala común 0–0.04</text>
