  <text x="85" y="1165" class="body">Precisión 1.85% · recall 34.67% · F1 0.035052</text>
  <text x="85" y="1210" class="body">52 aciertos positivos / 2,817 alertas</text>
  <text x="85" y="1255" class="small muted">Umbral 0.5: solo 1 / 150 positivos detectados.</text>
  <text x="950" y="1165" class="body">Precisión 2.35% · recall 36.89% · F1 0.044161</text>
  <text x="950" y="1210" class="body">45 aciertos positivos / 1,916 alertas</text>
  <text x="950" y="1255" class="small muted">Umbral 0.5: ninguna alerta; precisión indefinida.</text>

  <text x="60" y="1343" class="small">* Nuevas respecto a entrenamiento, no una cohorte externa. Temporal: personas pueden reaparecer.</text>
  <text x="60" y="1385" class="small">AP no interpolada; empates agrupados. TN/TP: aciertos; FP/FN: errores. Colores categóricos, no escala.</text>
  <text x="60" y="1427" class="small">Modelo: runners-day-logistic-v1 · Datos CC0: doi.org/10.34894/UWU9PV · Solo agregados.</text>
