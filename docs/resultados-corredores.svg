  <text x="965" y="538" class="small">Comparador negativo: 0.016061</text>
  <rect id="temporal-dummy-ap" x="965" y="552" width="260.992628" height="31" rx="5" fill="#9ba9b5"/>
  <path d="M100 600H750 M100 595V607 M262.5 595V607 M425 595V607 M587.5 595V607 M750 595V607 M965 600H1615 M965 595V607 M1127.5 595V607 M1290 595V607 M1452.5 595V607 M1615 595V607" fill="none" stroke="#718496" stroke-width="2"/>
